name: Backend CI

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  push:
    branches: [master]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: biletflow
          POSTGRES_PASSWORD: biletflow
          POSTGRES_DB: biletflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biletflow -d biletflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456
      TICKET_SIGNING_SECRET: ci-only-ticket-secret-0123456789abcdef012
      DATABASE_URL: postgresql+asyncpg://biletflow:biletflow@localhost:5432/biletflow_test
      TEST_DATABASE_URL: postgresql+asyncpg://biletflow:biletflow@localhost:5432/biletflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - name: Models and migrations agree
        run: uv run alembic check
      - name: Migrations can be reversed
        run: uv run alembic downgrade base
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build .
