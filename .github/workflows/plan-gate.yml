name: Plan Gate

# No path filter: a required check has to run on every PR or it blocks merging.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  plan-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the gate
        working-directory: .claude/skills/plan-gate/scripts
        run: python3 -m unittest test_plan_gate

      - name: Check step order
        run: python3 .claude/skills/plan-gate/scripts/plan_gate.py check "$GITHUB_HEAD_REF"
