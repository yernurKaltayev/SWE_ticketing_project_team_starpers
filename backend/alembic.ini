[alembic]
script_location = alembic
prepend_sys_path = .
# Migration files are named by their message: use the part prefix, e.g. -m p4_seat_holds
file_template = %%(slug)s
truncate_slug_length = 60

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
