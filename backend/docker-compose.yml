services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: biletflow
      POSTGRES_DB: biletflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://biletflow:biletflow@db:5432/biletflow
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in backend/.env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
