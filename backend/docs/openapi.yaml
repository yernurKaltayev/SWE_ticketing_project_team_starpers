components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOut'
  schemas:
    ActivationOut:
      properties:
        event_id:
          format: uuid
          title: Event Id
          type: string
        status:
          enum:
          - incomplete
          - active
          - suspended
          title: Status
          type: string
        identity_verified:
          title: Identity Verified
          type: boolean
        payout_account_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Payout Account Id
        activation_fee_paid:
          title: Activation Fee Paid
          type: boolean
        terms_accepted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Terms Accepted At
        missing_steps:
          items:
            type: string
          title: Missing Steps
          type: array
        is_simulated:
          title: Is Simulated
          type: boolean
      required:
      - event_id
      - status
      - identity_verified
      - payout_account_id
      - activation_fee_paid
      - terms_accepted_at
      - missing_steps
      - is_simulated
      title: ActivationOut
      type: object
    ActivationUpdate:
      properties:
        payout_account_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Payout Account Id
        accept_terms:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Accept Terms
      title: ActivationUpdate
      type: object
    AnalyticsOut:
      properties:
        capacity:
