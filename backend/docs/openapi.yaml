        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/{event_id}/analytics:
    get:
      tags:
      - analytics
      summary: Sales, inventory and check-in analytics from DB records
      description: 'Owner: P13. Access: event owner, platform admin, or staff (manager); check-in and
        support staff get 403. Read-only, from authoritative rows (never GA4). Sale orders are paid,
        free_confirmed and refunded; gross is list price, net = gross - discounts - refunds (tiyn).
        sold/remaining/checked_in are the current ticket state and ignore the date filter; money and
        sales_over_time follow date_from (inclusive) / date_to (exclusive) on order creation, with
        days in the event time zone. With ticket_type_id, order-level discounts and refunds are split
        by that type''s share of the order.'
      operationId: get_events_event_id_analytics
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Orders at or after
      - name: date_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Orders before
      - name: ticket_type_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Only this ticket type
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
