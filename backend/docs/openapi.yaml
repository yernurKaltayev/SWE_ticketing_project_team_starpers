openapi: 3.1.0
info:
  title: BiletFlow API
  version: 0.1.0
  description: 'Contract for the BiletFlow backend and the source of truth for all parts: change this
    file first, then the code. tests/api/test_contract.py fails if a route is implemented but not declared
    here.


    Conventions: money is an integer in tiyn (1 KZT = 100) with a currency field. Timestamps are ISO 8601
    with an offset. Every non-2xx response has the Error body with a stable `code`. Lists are paginated
    with limit/offset unless noted. Every response carries X-Request-ID. Payments, payouts and identity
    checks are simulated: `is_simulated` must be shown to users.'
servers:
- url: /api/v1
tags:
- name: auth
- name: users
- name: events
- name: venues
- name: ticket-types
- name: holds
- name: orders
- name: payments
- name: refunds
- name: tickets
- name: checkin
- name: promos
- name: notifications
- name: support
- name: admin
- name: history
- name: analytics
- name: calendar
- name: health
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - auth
      summary: Create an account and send a verification email
      description: 'Owner: P1. Access: public.'
      operationId: post_auth_register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/verify-email:
    post:
      tags:
      - auth
      summary: Confirm an email address
      description: 'Owner: P1. Access: public.'
      operationId: post_auth_verify_email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailIn'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
        '422':
          $ref: '#/components/responses/Error'
  /auth/resend-verification:
    post:
      tags:
      - auth
      summary: Send a new verification email; responds the same for unknown or verified addresses (rate
        limited)
      description: 'Owner: P1. Access: public.'
      operationId: post_auth_resend_verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationIn'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      tags:
      - auth
      summary: Sign in (rate limited)
      description: 'Owner: P1. Access: public. 401 invalid_credentials; 403 account_suspended or
        email_not_verified, only after a correct password. With X-Auth-Transport: cookie (web) the
        refresh token is set as the HttpOnly cookie biletflow_refresh (SameSite=Strict, path /api/v1/auth)
        with a readable marker cookie biletflow_session (path /), and refresh_token in the body is
        null. Without the header (mobile) it is returned in the body and no cookie is set.'
      operationId: post_auth_login
      security: []
      parameters:
      - name: X-Auth-Transport
        in: header
        required: false
        schema:
          type: string
          enum:
          - cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange a refresh token; the old one is revoked
      description: 'Owner: P1. Access: public. Presenting an already rotated token is treated as theft:
        every session of that user is revoked. Clients must not refresh twice in parallel. A token in
        the body is answered in the body (mobile). Without a body the biletflow_refresh cookie is used:
        the replacement is set as the cookie and refresh_token in the body is null (web). A rejected
        cookie is cleared with the error.'
      operationId: post_auth_refresh
      security: []
      parameters:
      - name: biletflow_refresh
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Revoke a refresh token
      description: 'Owner: P1. Access: a token in the body needs the bearer of the same account. Without
        a body the biletflow_refresh cookie is revoked with no bearer needed, so a web sign-out works
        after the access token expired; both session cookies are cleared.'
      operationId: post_auth_logout
      security:
      - bearerAuth: []
      - {}
      parameters:
      - name: biletflow_refresh
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /auth/forgot-password:
    post:
      tags:
      - auth
      summary: Send a reset email; responds the same for unknown addresses (rate limited)
      description: 'Owner: P1. Access: public.'
      operationId: post_auth_forgot_password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordIn'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/reset-password:
    post:
      tags:
      - auth
      summary: Set a new password with a reset token
      description: 'Owner: P1. Access: public.'
      operationId: post_auth_reset_password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordIn'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /me:
    get:
      tags:
      - users
      summary: Current user
      description: 'Owner: P1. Access: any signed-in user.'
      operationId: get_me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - users
      summary: Update the current user
      description: 'Owner: P1. Access: any signed-in user.'
      operationId: patch_me
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /organizers/me:
    get:
      tags:
      - users
      summary: Own organizer profile
      description: 'Owner: P1. Access: organizer.'
      operationId: get_organizers_me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfileOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - users
      summary: Update own organizer profile
      description: 'Owner: P1. Access: organizer.'
      operationId: patch_organizers_me
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerProfileUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfileOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/{event_id}/staff:
    get:
      tags:
      - users
      summary: List an event's staff with name, email and role
      description: 'Owner: P1 (F7). Access: event owner, platform admin, or staff (manager).'
      operationId: get_events_event_id_staff
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMemberOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - users
      summary: Assign a user to an event's staff
      description: 'Owner: P1. Access: event owner, platform admin, or staff (manager).
        Identify the user by exactly one of user_id or email.'
      operationId: post_events_event_id_staff
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAssignIn'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAssignmentOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/{event_id}/staff/{user_id}:
    delete:
      tags:
      - users
      summary: Remove a staff assignment
      description: 'Owner: P1. Access: event owner, platform admin, or staff (manager).'
      operationId: delete_events_event_id_staff_user_id
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events:
    get:
      tags:
      - events
      summary: Search public published events (q, category, city, date_from, date_to)
      description: 'Owner: P2. Access: public.'
      operationId: get_events
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: city
        in: query
        required: false
        schema:
          type: string
      - name: date_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: date_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      security: []
      responses:
        '200':
          description: Page of results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEventOut'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - events
      summary: Create a draft event
      description: 'Owner: P2. Access: organizer.'
      operationId: post_events
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /organizers/me/events:
    get:
      tags:
      - events
      summary: Own events, all statuses
      description: 'Owner: P2. Access: organizer.'
      operationId: get_organizers_me_events
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Page of results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEventOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/by-token/{share_token}:
    get:
      tags:
      - events
      summary: Open an unlisted or private event by its share link
      description: 'Owner: P2. Access: public.'
      operationId: get_events_by_token_share_token
      parameters:
      - name: share_token
        in: path
        required: true
        schema:
          type: string
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/{event_id}:
    get:
      tags:
      - events
      summary: Event details; drafts and private events need event access
      description: 'Owner: P2. Access: public.'
      operationId: get_events_event_id
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - events
      summary: Edit an event; price/capacity changes are audited
      description: 'Owner: P2. Access: event owner, platform admin, or staff (manager).'
      operationId: patch_events_event_id
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/{event_id}/publish:
    post:
      tags:
      - events
      summary: Publish; needs at least one ticket type and capacity >= ticket quantities
      description: 'Owner: P2. Access: event owner, platform admin, or staff (manager).'
      operationId: post_events_event_id_publish
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/{event_id}/unpublish:
    post:
      tags:
      - events
      summary: Return to draft
      description: 'Owner: P2. Access: event owner, platform admin, or staff (manager).'
      operationId: post_events_event_id_unpublish
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/{event_id}/cancel:
    post:
      tags:
      - events
      summary: Cancel; triggers bulk refunds and notifications
      description: 'Owner: P2. Access: event owner, platform admin, or staff (manager).'
      operationId: post_events_event_id_cancel
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/{event_id}/duplicate:
    post:
      tags:
      - events
      summary: Copy configuration only, never orders, tickets, payments, check-ins or support
      description: 'Owner: P2. Access: event owner, platform admin, or staff (manager).'
      operationId: post_events_event_id_duplicate
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events/{event_id}/images:
    post:
      tags:
      - events
      summary: Upload the event cover image
      description: 'Owner: P2. Access: event owner, platform admin, or staff (manager).
        Multipart upload of one JPEG, PNG or WebP file (at most 5 MB); the format is
        checked from the file content. Replaces any previous cover image.'
      operationId: post_events_event_id_images
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - events
      summary: Remove the event cover image
      description: 'Owner: P2. Access: event owner, platform admin, or staff (manager).'
      operationId: delete_events_event_id_images
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /event-images/{event_id}/{name}:
    get:
      tags:
      - events
      summary: Event image file
      description: 'Owner: P2. Access: public. Names are random and immutable, so the
        response is cacheable indefinitely.'
      operationId: get_event_images_event_id_name
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
  /venues:
    get:
      tags:
      - venues
      summary: List venues
      description: 'Owner: P4. Access: public.'
      operationId: get_venues
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      security: []
      responses:
        '200':
          description: Page of results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVenueOut'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - venues
      summary: Add a venue typed in the event editor
      description: 'Owner: P2. Access: organizer or platform admin. Fields are trimmed. The new
        venue joins the shared list. The same name, address and city (any letter case) returns
        the existing venue with 200 instead of a copy; a new one returns 201.'
      operationId: post_venues
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueCreate'
      responses:
        '200':
          description: An existing venue with the same name, address and city
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueOut'
        '201':
