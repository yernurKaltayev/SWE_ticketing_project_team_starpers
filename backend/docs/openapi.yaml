  /events/{event_id}/history:
    get:
      tags:
      - history
      summary: Audit trail of one event, newest first
      description: 'Owner: P12. Access: event owner, platform admin, or staff (manager); check-in and support
        staff get 403. Works for every event status, so completed and cancelled events stay readable. `lifecycle`
        is derived from dates (upcoming/active/completed) and is `cancelled` for cancelled events. `date_from`
        is inclusive, `date_to` exclusive. `category` groups action names: event, ticket_type, staff, order,
        payment, refund, promo, support, checkin, paid_sales, admin.'
      operationId: get_events_event_id_history
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Entries at or after
      - name: date_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Entries before
      - name: action_type
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Exact action name
      - name: category
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
        description: Action category
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Page of audit entries
          content:
