[project]
name = "biletflow-backend"
version = "0.1.0"
description = "BiletFlow event-ticketing backend (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler<4",
    "asyncpg>=0.32.0",
    "boto3>=1.43.123",
    "cryptography>=45",
    "fastapi>=0.162.0",
    "fastapi-mail>=1.6.8",
    "icalendar>=7.3.0",
    "itsdangerous>=2.2.0",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "qrcode[pil]>=8.2",
    "reportlab>=5.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() in argument defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/conftest.py" = ["S101", "S105", "S106", "E402"] # env vars must be set before app imports
"scripts/**" = ["S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*", # passlib is unmaintained but is the plan's choice
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]
